<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — PlayMaker Prime</title>

    <meta name="description"
        content="Reset your PlayMaker Prime account password and regain access to the PlayMaker prediction engine.">

    <link rel="stylesheet" href="assets/css/pricing.css">
    <link rel="stylesheet" href="/assets/css/entity-links.css" />
    <link rel="icon" href="assets/images/favicon.png">

</head>

<body>

    <!-- ENTITY LINKS -->
    <div id="entity-links"></div>
    <script src="/assets/js/entity-link-engine.js"></script>

    <section class="pricing-hero">

        <div class="hero-glow"></div>

        <div class="pricing-hero-content">

            <span class="hq-pill">
                Account Recovery
            </span>

            <h2>

                Forgot your password?

                <span>

                    We'll help you get back in.

                </span>

            </h2>

            <p>

                Enter the email address associated with your PlayMaker Prime account.

                If an account exists, we'll send password reset instructions.

            </p>

            <div class="login-card">

                <h3>Reset Password</h3>

                <form id="forgot-form">

                    <label>Email Address</label>

                    <input id="email" type="email" placeholder="you@example.com" required>

                    <button type="submit" class="btn-primary">

                        Send Reset Link

                    </button>

                </form>

                <p id="forgot-message" class="login-message">
                </p>

                <div class="login-links">

                    <a href="login.html">

                        ← Back to Login

                    </a>

                    <a href="pricing.html">

                        View Plans

                    </a>

                </div>

            </div>

        </div>

    </section>

    <footer>

        <p>

            &copy; 2025 PlayMaker Prime. All Rights Reserved.

        </p>

    </footer>

    <script>

        document
            .getElementById("forgot-form")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const message =
                    document
                        .getElementById("forgot-message");

                message.className = "login-message";
                message.textContent = "Sending reset email...";

                try {

                    const response = await fetch("/api/forgot-password", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email
                        })

                    });

                    const data = await response.json();

                    if (!response.ok) {

                        throw new Error(
                            data.error || "Unable to send reset email."
                        );

                    }

                    message.className = "login-message success";

                    message.textContent =
                        "If an account exists for that email, password reset instructions have been sent.";

                } catch (err) {

                    message.className = "login-message error";

                    message.textContent =
                        "Password reset isn't connected yet. This feature will become available when account management launches.";

                }

            });

    </script>

    <script src="/assets/js/analytics-tracker.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (!window.matchMedia("(max-width: 768px)").matches) return;

            document.querySelectorAll(".hq-section").forEach((section, index) => {
                const header = section.querySelector(":scope > .section-header");
                if (!header) return;

                if (index === 0) {
                    section.classList.add("is-open");
                }

                header.addEventListener("click", () => {
                    section.classList.toggle("is-open");
                });
            });
        });
    </script>

</body>

</html>
